services:
  identity-access-service:
    image: admin-delta/identity-access-service:${APP_ENV:-development}
    build:
      context: .
      dockerfile: services/identity-access-service/Dockerfile
      target: ${APP_ENV:-development}
    container_name: admin-delta-identity-access-${APP_ENV:-development}
    restart: unless-stopped
    env_file:
      - ./services/identity-access-service/.env
    ports:
      - "8081:8081"
    networks:
      - admin-delta-network

networks:
  admin-delta-network:
    name: admin-delta-network
    driver: bridge
