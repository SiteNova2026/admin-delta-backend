# ==========================================
# APPLICATION
# ==========================================
spring.application.name=identity-access-service
server.port=${SERVER_PORT:8081}

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/identity_access_db}
spring.datasource.username=${DB_USERNAME:identity_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIBERNATE / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================================
# FLYWAY
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


# ==========================================
# REDIS
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ==========================================
# GOOGLE OAUTH2
# ==========================================
#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
#spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ==========================================
# MSG91 OTP WIDGET
# ==========================================
msg91.auth-key=${MSG91_AUTH_KEY:}
msg91.widget-id=${MSG91_WIDGET_ID:}

# ==========================================
# ADMIN DELTA JWT
# ==========================================
security.jwt.secret=${JWT_SECRET:}
security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
security.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:30}
